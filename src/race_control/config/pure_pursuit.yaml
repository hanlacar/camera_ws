pure_pursuit:
  ros__parameters:
    path_topic: "/perception/local_path_json"
    # Use the signed m/s value calculated and published by T870_MCU.
    speed_feedback_topic: "/mcu/speed_mps"
    steering_topic: "/camera/target_steering_deg"
    target_speed_topic: "/camera/target_speed_mps"
    status_topic: "/control/pure_pursuit_status_json"
    lookahead_topic: "/control/lookahead_m"
    lookahead_point_topic: "/control/lookahead_point_json"
    # Measured axle-to-axle distance: approximately 0.73 m.
    wheelbase_m: 0.73
    # Camera-path verification uses a fixed 3.0 m Pure Pursuit lookahead.
    minimum_lookahead_m: 3.0
    lookahead_gain_s: 0.0
    maximum_lookahead_m: 3.0
    maximum_steering_deg: 27.0
    steering_sign: 1.0
    minimum_confidence: 0.45
    path_timeout_sec: 0.6
    control_rate_hz: 20.0
    commanded_speed_mps: 0.0
    allow_reverse: false
