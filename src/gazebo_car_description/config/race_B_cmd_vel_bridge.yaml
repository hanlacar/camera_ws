# Debug-only overhead camera bridge. It is independent from control and can be
# removed with the matching overhead_debug_camera URDF sensor block.
- ros_topic_name: "/overhead_debug_camera/image"
  gz_topic_name: "/overhead_debug_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/scan_rear"
